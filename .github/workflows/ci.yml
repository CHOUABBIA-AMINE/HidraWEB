name: HidraWEB CI

on:
  push:
    branches:
      - main
      - 'hweb-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify HidraAPI OpenAPI compatibility
        run: npm run openapi:compatibility

      - name: Generate HWEB-003 workbench OpenAPI client
        run: npm run api:generate:workbench
      - name: Generate HWEB-004 identity/organization OpenAPI client
        run: npm run api:generate:identity-organization
      - name: Generate HWEB-005 topology OpenAPI client
        run: npm run api:generate:topology
      - name: Generate HWEB-006 telemetry/monitoring OpenAPI client
        run: npm run api:generate:telemetry-monitoring
      - name: Generate HWEB-007 workflow OpenAPI client
        run: npm run api:generate:workflow
      - name: Generate HWEB-008 alarm OpenAPI client
        run: npm run api:generate:alarm
      - name: Generate HWEB-009 incident OpenAPI client
        run: npm run api:generate:incident
      - name: Generate HWEB-009 leak OpenAPI client
        run: npm run api:generate:leak
      - name: Generate HWEB-009 HSE OpenAPI client
        run: npm run api:generate:hse
      - name: Generate HWEB-010 planning OpenAPI client
        run: npm run api:generate:planning
      - name: Generate HWEB-012 custody OpenAPI client
        run: npm run api:generate:custody
      - name: Generate HWEB-013 risk OpenAPI client
        run: npm run api:generate:risk
      - name: Generate HWEB-013 analytics OpenAPI client
        run: npm run api:generate:analytics
      - name: Generate HWEB-013 simulation OpenAPI client
        run: npm run api:generate:simulation
      - name: Generate HWEB-013 reporting OpenAPI client
        run: npm run api:generate:reporting
      - name: Generate HWEB-014 audit OpenAPI client
        run: npm run api:generate:audit
      - name: Generate HWEB-014 configuration OpenAPI client
        run: npm run api:generate:configuration
      - name: Generate HWEB-014 documents OpenAPI client
        run: npm run api:generate:documents

      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test
      - name: Performance tests
        run: npm run test:performance
      - name: Production build
        run: npm run build
      - name: Package release artifact
        env:
          HIDRA_RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: npm run release:package
      - name: Verify release artifact
        env:
          HIDRA_RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: npm run release:verify
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full Playwright regression suite
        run: npm run test:e2e
      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidraweb-release-${{ github.sha }}
          path: release/hidraweb
          if-no-files-found: error
