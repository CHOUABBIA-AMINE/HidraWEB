name: HidraWEB Code CI

on:
  push:
    branches:
      - main
      - 'hweb-*'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify HidraAPI OpenAPI compatibility
        run: npm run openapi:compatibility

      - name: Generate HWEB-003 workbench OpenAPI client
        run: npm run api:generate:workbench
      - name: Generate HWEB-004 identity/organization OpenAPI client
        run: npm run api:generate:identity-organization
      - name: Generate HWEB-F11 Party OpenAPI client
        run: npm run api:generate:party
      - name: Generate HWEB-005 topology OpenAPI client
        run: npm run api:generate:topology
      - name: Generate HWEB-006 telemetry/monitoring OpenAPI client
        run: npm run api:generate:telemetry-monitoring
      - name: Generate HWEB-007 workflow OpenAPI client
        run: npm run api:generate:workflow
      - name: Generate HWEB-008 alarm OpenAPI client
        run: npm run api:generate:alarm
      - name: Generate HWEB-009 incident OpenAPI client
        run: npm run api:generate:incident
      - name: Generate HWEB-009 leak OpenAPI client
        run: npm run api:generate:leak
      - name: Generate HWEB-009 HSE OpenAPI client
        run: npm run api:generate:hse
      - name: Generate HWEB-010 planning OpenAPI client
        run: npm run api:generate:planning
      - name: Generate HWEB-011 assets OpenAPI client
        run: npm run api:generate:assets
      - name: Generate HWEB-011 integrity OpenAPI client
        run: npm run api:generate:integrity
      - name: Generate HWEB-012 custody OpenAPI client
        run: npm run api:generate:custody
      - name: Generate HWEB-013 risk OpenAPI client
        run: npm run api:generate:risk
      - name: Generate HWEB-013 analytics OpenAPI client
        run: npm run api:generate:analytics
      - name: Generate HWEB-013 simulation OpenAPI client
        run: npm run api:generate:simulation
      - name: Generate HWEB-013 reporting OpenAPI client
        run: npm run api:generate:reporting
      - name: Generate HWEB-014 audit OpenAPI client
        run: npm run api:generate:audit
      - name: Generate HWEB-014 configuration OpenAPI client
        run: npm run api:generate:configuration
      - name: Generate HWEB-014 documents OpenAPI client
        run: npm run api:generate:documents

      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test
      - name: Performance tests
        run: npm run test:performance
      - name: Production build
        run: npm run build
      - name: Package release artifact
        env:
          HIDRA_RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: npm run release:package
      - name: Verify release artifact
        env:
          HIDRA_RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: npm run release:verify
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full Playwright regression suite
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/mock-browser-results.json
        run: |
          npm run test:e2e -- --reporter=list,json
          node scripts/check-browser-results.mjs "$PLAYWRIGHT_JSON_OUTPUT_NAME"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const report=JSON.parse(readFileSync(process.argv[1],"utf8")); if(report.stats.expected < 122) throw new Error("UXR29 requires the 119 existing mocked tests and three added regressions");' "$PLAYWRIGHT_JSON_OUTPUT_NAME"
      # This suite uses synthetic/mocked API data only. Native JWT and PostgreSQL
      # runs deliberately keep trace/screenshot/video disabled and are not uploaded.
      - name: Preserve mocked-browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hidraweb-mocked-browser-failure-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidraweb-release-${{ github.sha }}
          path: release/hidraweb
          if-no-files-found: error

  foundation-native:
    name: A1 six-module native API and PostgreSQL browser qualification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hidra_foundation_w1
          POSTGRES_USER: hidra
          POSTGRES_PASSWORD: hidra-w1-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hidra -d hidra_foundation_w1"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      HIDRA_FOUNDATION_WEB_URL: http://127.0.0.1:5173
      HIDRA_FOUNDATION_API_URL: http://127.0.0.1:8080
      HIDRA_FOUNDATION_ADMIN: w1-native-admin
      HIDRA_FOUNDATION_REQUIRE_NATIVE: '1'
      HIDRA_TEST_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/hidra_foundation_w1
      HIDRA_TEST_DATASOURCE_USERNAME: hidra
      HIDRA_TEST_DATASOURCE_PASSWORD: hidra-w1-ci
      HIDRA_SECURITY_AUTHENTICATION_MODE: jwt
      HIDRA_SECURITY_BOOTSTRAP_ENABLED: 'true'
      HIDRA_SECURITY_BOOTSTRAP_USERNAME: w1-native-admin
      HIDRA_SECURITY_BOOTSTRAP_EMAIL_ADDRESS: w1-admin@synthetic.invalid
      SPRING_PROFILES_ACTIVE: test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: hidra
      PGPASSWORD: hidra-w1-ci
      PGDATABASE: hidra_foundation_w1
    steps:
      - name: Checkout WEB
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout accepted immutable API source
        uses: actions/checkout@v5
        with:
          repository: CHOUABBIA-AMINE/HidraAPI
          ref: 5817406923e53761577ac41bbc3f318b517c3977
          path: .native-api
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: .native-api/pom.xml
      - name: Restore pinned Maven wrapper distribution
        id: foundation-maven-wrapper
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/wrapper/dists
          key: ${{ runner.os }}-w1-maven-wrapper-${{ hashFiles('.native-api/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Bootstrap pinned Maven wrapper with bounded download retries
        working-directory: .native-api
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          for attempt in 1 2 3; do
            if ./mvnw -B --version; then exit 0; fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Pinned Maven wrapper bootstrap failed after 3 attempts"
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          exit 1
      - name: Save completed pinned Maven wrapper distribution
        if: steps.foundation-maven-wrapper.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/wrapper/dists
          key: ${{ steps.foundation-maven-wrapper.outputs.cache-primary-key }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install WEB and generate pinned clients
        run: |
          npm ci --no-audit --no-fund
          npm run prebuild
          npx playwright install --with-deps chromium
      - name: Generate disposable masked credential and signing material
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          password = secrets.token_urlsafe(32)
          signing = secrets.token_urlsafe(48)
          ordinary = secrets.token_urlsafe(32)
          proof = base64.b64encode(secrets.token_bytes(32)).decode('ascii')
          print('::add-mask::' + proof)
          print('::add-mask::' + password)
          print('::add-mask::' + signing)
          print('::add-mask::' + ordinary)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('HIDRA_FOUNDATION_PASSWORD=' + password + '\n')
              output.write('HIDRA_FOUNDATION_USER_PASSWORD=' + ordinary + '\n')
              output.write('HIDRA_IDENTITY_ORGANIZATIONCOMMITPROOF_SIGNINGKEYBASE64=' + proof + '\n')
              output.write('HIDRA_SECURITY_BOOTSTRAP_PASSWORD=' + password + '\n')
              output.write('HIDRA_JWT_HMAC_SECRET=' + signing + '\n')
          PY
      - name: Build pinned API and migrate fresh schema before administrator bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .native-api rev-parse HEAD)" = 5817406923e53761577ac41bbc3f318b517c3977
          cd .native-api
          chmod +x mvnw
          ./mvnw -B -q -Dmaven.test.skip=true package
          APP_JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "${APP_JAR}"
          java -jar "${APP_JAR}" --server.port=8080 --management.server.port=8080 \
            --springdoc.api-docs.enabled=true --springdoc.swagger-ui.enabled=false \
            --hidra.security.bootstrap.enabled=false \
            --hidra.platform.security.cors.allowed-origins=http://127.0.0.1:5173 \
            --hidra.platform.security.jwt.token-issuer=https://foundation.synthetic.invalid \
            > "${RUNNER_TEMP}/w1-api.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/w1-api.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "${RUNNER_TEMP}/w1-api.pid")" 2>/dev/null; then
              tail -n 100 "${RUNNER_TEMP}/w1-api.log"
              exit 1
            fi
            sleep 2
          done
          tail -n 100 "${RUNNER_TEMP}/w1-api.log"
          exit 1
      - name: Seed synthetic catalogs in the exact disposable database
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 --file scripts/foundation-native-fixture.sql
          psql -v ON_ERROR_STOP=1 --file scripts/foundation-topology-fixture.sql
          psql -v ON_ERROR_STOP=1 --file scripts/foundation-configuration-fixture.sql
      - name: Configure separated native appointment roles and purpose-specific key
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -XAtqc 'SELECT current_database()')" = hidra_foundation_w1
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          CREATE ROLE a1_appointment_config LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION PASSWORD 'hidra-w1-ci';
          CREATE ROLE a1_proof_admin LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION PASSWORD 'hidra-w1-ci';
          GRANT USAGE ON SCHEMA public TO a1_appointment_config, a1_proof_admin;
          GRANT EXECUTE ON FUNCTION public.hidra_org_activate_appointment_binding(text,text,text,bigint),
            public.hidra_org_activate_appointment_policy(text,text,bigint,jsonb),
            public.hidra_party_require_organization_configuration_reference(text) TO a1_appointment_config;
          GRANT EXECUTE ON FUNCTION public.hidra_identity_org_commit_admin(bigint,text,uuid,name,bytea) TO a1_proof_admin;
          DO $$
          DECLARE relation text;
          BEGIN
            FOR relation IN SELECT tablename FROM pg_tables WHERE schemaname='public'
              AND (tablename LIKE 'hidra_org_appointment_%' OR tablename='hidra_org_employee_assignment') LOOP
              EXECUTE format('REVOKE INSERT,UPDATE,DELETE ON public.%I FROM w2_app', relation);
            END LOOP;
          END $$;
          REVOKE ALL ON public.hidra_identity_org_commit_key_event,public.hidra_identity_org_commit_key_head,
            public.hidra_identity_org_commit_proof_use FROM w2_app,w2_installed,w2_setup,w2_configuration;
          GRANT UPDATE ON public.hidra_org_employee,public.hidra_org_unit,public.hidra_org_position,
            public.hidra_org_appointment_binding_head,public.hidra_org_appointment_policy_head,
            public.hidra_org_appointment_lock_key,public.hidra_org_employee_assignment TO w2_installed;
          GRANT INSERT ON public.hidra_org_appointment_lock_key,public.hidra_org_employee_assignment,
            public.hidra_org_appointment_event TO w2_installed;
          GRANT EXECUTE ON FUNCTION public.hidra_org_appointment_exact_id(text),
            public.hidra_identity_org_commit_key_context(boolean),
            public.hidra_org_appointment_final_guard(uuid,uuid,uuid,text,text,text,text,timestamptz,timestamptz,integer,bigint,bytea,bytea,timestamptz),
            public.hidra_org_appointment_read_guard(jsonb,timestamptz,timestamptz,integer,bigint,timestamptz) TO w2_installed;
          COMMIT;
          SQL
          revision="$(PGUSER=a1_proof_admin psql -XAt -v ON_ERROR_STOP=1 <<SQL
          SELECT public.hidra_identity_org_commit_admin(0,'a1-synthetic-key',gen_random_uuid(),'w2_installed',
            decode('${HIDRA_IDENTITY_ORGANIZATIONCOMMITPROOF_SIGNINGKEYBASE64}','base64'));
          SQL
          )"
          test "${revision}" = 1
          {
            echo 'HIDRA_IDENTITY_ORGANIZATIONCOMMITPROOF_ENABLED=true'
            echo 'HIDRA_IDENTITY_ORGANIZATIONCOMMITPROOF_KEYID=a1-synthetic-key'
            echo "HIDRA_IDENTITY_ORGANIZATIONCOMMITPROOF_KEYREVISION=${revision}"
          } >> "${GITHUB_ENV}"
      - name: Restart native API with real audited administrator bootstrap
        shell: bash
        run: |
          set -euo pipefail
          OLD_PID="$(cat "${RUNNER_TEMP}/w1-api.pid")"
          kill "${OLD_PID}"
          for attempt in $(seq 1 60); do
            if ! kill -0 "${OLD_PID}" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "${OLD_PID}" 2>/dev/null; then
            echo "Schema initialization process did not stop"
            exit 1
          fi
          APP_JAR="$(find .native-api/target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "${APP_JAR}"
          java -jar "${APP_JAR}" --server.port=8080 --management.server.port=8080 \
            --springdoc.api-docs.enabled=true --springdoc.swagger-ui.enabled=false \
            --hidra.security.bootstrap.enabled=true \
            --spring.datasource.username=w2_app --spring.datasource.password=hidra-w1-ci \
            --spring.flyway.url="${HIDRA_TEST_DATASOURCE_URL}" \
            --spring.flyway.user=hidra --spring.flyway.password=hidra-w1-ci \
            --hidra.platform.persistence.publication.enabled=true \
            --hidra.platform.persistence.publication.username=w2_installed \
            --hidra.platform.persistence.publication.password=hidra-w1-ci \
            --hidra.platform.persistence.topology-setup.enabled=true \
            --hidra.platform.persistence.topology-setup.username=w2_setup \
            --hidra.platform.persistence.topology-setup.password=hidra-w1-ci \
            --hidra.platform.persistence.station-configuration.enabled=true \
            --hidra.platform.persistence.station-configuration.username=w2_configuration \
            --hidra.platform.persistence.station-configuration.password=hidra-w1-ci \
            --hidra.platform.security.cors.allowed-origins=http://127.0.0.1:5173 \
            --hidra.platform.security.jwt.token-issuer=https://foundation.synthetic.invalid \
            > "${RUNNER_TEMP}/w1-api.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/w1-api.pid"
          for attempt in $(seq 1 60); do
            if ! kill -0 "$(cat "${RUNNER_TEMP}/w1-api.pid")" 2>/dev/null; then
              tail -n 100 "${RUNNER_TEMP}/w1-api.log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null &&
              [ "$(psql -Atqc "SELECT EXISTS (SELECT 1 FROM public.hidra_audit_event WHERE event_type_id='IDENTITY_LOCAL_ADMIN_BOOTSTRAP' AND event_category_id='SECURITY_ADMINISTRATION')")" = t ]; then
              echo "Native administrator bootstrap committed its required audit event"
              exit 0
            fi
            sleep 2
          done
          tail -n 100 "${RUNNER_TEMP}/w1-api.log"
          exit 1
      - name: Prepare synthetic current W2 permissions
        run: node scripts/prepare-foundation-topology.mjs
      - name: Run mandatory A1 Journey B and verify its handoff to Journey C
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_JSON_OUTPUT_NAME="${RUNNER_TEMP}/a1-native-results.json"
          npm run test:e2e:foundation -- --grep 'A1 native' --reporter=list,json
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ['PLAYWRIGHT_JSON_OUTPUT_NAME']) as report:
              stats = json.load(report)['stats']
          assert stats['expected'] == 1, stats
          assert stats['unexpected'] == stats['flaky'] == stats['skipped'] == 0, stats
          PYTHON
      - name: Run mandatory W1, W2 and W3 browser journeys against native JWT and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_JSON_OUTPUT_NAME="${RUNNER_TEMP}/w1-native-results.json"
          npm run test:e2e:foundation -- --grep-invert 'A1 native|W4 native' --reporter=list,json
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ['PLAYWRIGHT_JSON_OUTPUT_NAME']) as report:
              stats = json.load(report)['stats']
          assert stats['expected'] == 7, stats
          assert stats['unexpected'] == stats['flaky'] == stats['skipped'] == 0, stats
          print('W1/W2/W3 native browser qualification: 7 passed, 0 failed/flaky/skipped')
          PYTHON
      - name: Prepare explicit synthetic W4 source and process configuration
        run: node scripts/prepare-foundation-workflow.mjs
      - name: Run mandatory W4 native review and denial browser journeys
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_JSON_OUTPUT_NAME="${RUNNER_TEMP}/w4-native-results.json"
          npm run test:e2e:foundation -- --grep 'W4 native' --reporter=list,json
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ['PLAYWRIGHT_JSON_OUTPUT_NAME']) as report:
              stats = json.load(report)['stats']
          assert stats['expected'] == 2, stats
          assert stats['unexpected'] == stats['flaky'] == stats['skipped'] == 0, stats
          print('W4 native browser qualification: 2 passed, 0 failed/flaky/skipped; seven W1-W3 preserved')
          PYTHON
      - name: Record exact-source qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/a1-evidence"
          mkdir -p "${evidence}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          {
            printf 'WEB_SHA=%s\n' "${GITHUB_SHA}"
            printf 'API_SHA=%s\n' "$(git -C .native-api rev-parse HEAD)"
            printf 'GITHUB_RUN_ID=%s\n' "${GITHUB_RUN_ID}"
            printf 'GITHUB_RUN_ATTEMPT=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'JWT_ISSUER=https://foundation.synthetic.invalid\n'
            printf 'DATABASE=hidra_foundation_w1\n'
            printf 'TEST_DATA=synthetic\n'
          } > "${evidence}/sources.txt"
          curl --fail --silent --show-error http://127.0.0.1:8080/v3/api-docs > "${evidence}/runtime-openapi.json"
          (cd "${evidence}" && sha256sum runtime-openapi.json > runtime-openapi.sha256)
          psql -X -v ON_ERROR_STOP=1 --csv -c 'SELECT installed_rank,version,script,checksum,success FROM public.flyway_schema_history ORDER BY installed_rank' > "${evidence}/migrations.csv"
          cp "${RUNNER_TEMP}"/{a1,w1,w4}-native-results.json "${evidence}/"
      - name: Upload A1 development qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: hidraweb-foundation-a1-${{ github.sha }}
          path: ${{ runner.temp }}/a1-evidence
          if-no-files-found: error
      - name: Stop disposable native API
        if: always()
        shell: bash
        run: |
          if [ -f "${RUNNER_TEMP}/w1-api.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/w1-api.pid")" 2>/dev/null || true
          fi

  local-session-native:
    name: F18 LOCAL session renewal and logout qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hidra_local_session_f18
          POSTGRES_USER: hidra
          POSTGRES_PASSWORD: hidra-f18-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hidra -d hidra_local_session_f18"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      HIDRA_LOCAL_SESSION_NATIVE: '1'
      HIDRA_FOUNDATION_API_URL: http://127.0.0.1:8080
      HIDRA_FOUNDATION_ADMIN: f18-native-admin
      HIDRA_TEST_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/hidra_local_session_f18
      HIDRA_TEST_DATASOURCE_USERNAME: hidra
      HIDRA_TEST_DATASOURCE_PASSWORD: hidra-f18-ci
      HIDRA_SECURITY_AUTHENTICATION_MODE: jwt
      HIDRA_SECURITY_BOOTSTRAP_USERNAME: f18-native-admin
      HIDRA_SECURITY_BOOTSTRAP_EMAIL_ADDRESS: f18-admin@synthetic.invalid
      HIDRA_IDENTITY_REFRESH_ENABLED: 'true'
      HIDRA_IDENTITY_REFRESH_THROTTLE_MAX_ATTEMPTS: '1'
      HIDRA_JWT_ACCESS_TOKEN_TTL_SECONDS: '40'
      SPRING_PROFILES_ACTIVE: test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: hidra
      PGPASSWORD: hidra-f18-ci
      PGDATABASE: hidra_local_session_f18
    steps:
      - name: Checkout WEB
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout accepted HAPI-929 source
        uses: actions/checkout@v5
        with:
          repository: CHOUABBIA-AMINE/HidraAPI
          ref: 720e9222b30fa45b7423ede9c9f141ab87298024
          path: .local-session-api
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: .local-session-api/pom.xml
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install WEB, generate clients and install Chromium
        run: |
          npm ci --no-audit --no-fund
          npm run prebuild
          npx playwright install --with-deps chromium
      - name: Build accepted API
        working-directory: .local-session-api
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 720e9222b30fa45b7423ede9c9f141ab87298024
          for attempt in 1 2 3; do
            if bash ./mvnw -B --version; then break; fi
            test "${attempt}" -lt 3
            sleep "$((attempt * 5))"
          done
          bash ./mvnw -B -q -Dmaven.test.skip=true package
      - name: Qualify LOCAL sessions in Chromium against fresh PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          HIDRA_FOUNDATION_PASSWORD="$(openssl rand -hex 24)"
          HIDRA_FOUNDATION_USER_PASSWORD="$(openssl rand -hex 24)"
          HIDRA_JWT_HMAC_SECRET="$(openssl rand -hex 32)"
          for secret in "${HIDRA_FOUNDATION_PASSWORD}" "${HIDRA_FOUNDATION_USER_PASSWORD}" "${HIDRA_JWT_HMAC_SECRET}"; do
            printf '::add-mask::%s\n' "${secret}"
          done
          export HIDRA_FOUNDATION_PASSWORD HIDRA_FOUNDATION_USER_PASSWORD HIDRA_JWT_HMAC_SECRET
          export HIDRA_SECURITY_BOOTSTRAP_PASSWORD="${HIDRA_FOUNDATION_PASSWORD}"
          api_jar="$(find .local-session-api/target -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "${api_jar}"
          api_pid=
          stop_api() {
            if [ -n "${api_pid}" ]; then
              kill "${api_pid}" 2>/dev/null || true
              wait "${api_pid}" || true
              api_pid=
            fi
          }
          trap stop_api EXIT
          start_api() {
            java -jar "${api_jar}" --server.address=127.0.0.1 --server.port=8080 \
              --management.server.port=8080 --hidra.security.bootstrap.enabled="$1" \
              --hidra.platform.security.jwt.token-issuer=https://local-session.synthetic.invalid \
              --hidra.platform.security.cors.allowed-origins=http://127.0.0.1:5173 \
              > "${RUNNER_TEMP}/f18-native-api.log" 2>&1 &
            api_pid=$!
            for attempt in $(seq 1 75); do
              if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then return; fi
              if ! kill -0 "${api_pid}" 2>/dev/null; then break; fi
              sleep 2
            done
            echo "Pinned F18 API failed to reach health."
            return 1
          }
          start_api false
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 --file scripts/local-session-native-fixture.sql
          stop_api
          start_api true
          test "$(psql -XAtqc "SELECT EXISTS (SELECT 1 FROM public.hidra_audit_event WHERE event_type_id='IDENTITY_LOCAL_ADMIN_BOOTSTRAP')")" = t
          export PLAYWRIGHT_JSON_OUTPUT_NAME="${RUNNER_TEMP}/f18-local-session-results.json"
          npx playwright test --config playwright.local-session.config.ts --reporter=list,json
          python3 - <<'PY'
          import json, os
          with open(os.environ['PLAYWRIGHT_JSON_OUTPUT_NAME']) as report:
              stats = json.load(report)['stats']
          assert stats['expected'] == 5, stats
          assert stats['unexpected'] == stats['flaky'] == stats['skipped'] == 0, stats
          print('F18 native browser qualification: 5 passed, 0 failed/flaky/skipped')
          PY
          printf 'WEB_SHA=%s\nAPI_SHA=%s\n' "${GITHUB_SHA}" "$(git -C .local-session-api rev-parse HEAD)"
          sha256sum openapi/candidates/hidra-identity-organization-720e9222b30fa45b7423ede9c9f141ab87298024.json

  alarm-native:
    name: F16 signed scoped Alarm browser and PostgreSQL qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hidra_alarm_f16
          POSTGRES_USER: hidra
          POSTGRES_PASSWORD: hidra-f16-disposable-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hidra -d hidra_alarm_f16"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      SPRING_PROFILES_ACTIVE: test
      HIDRA_TEST_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/hidra_alarm_f16
      HIDRA_TEST_DATASOURCE_USERNAME: hidra
      HIDRA_TEST_DATASOURCE_PASSWORD: hidra-f16-disposable-ci
      HIDRA_SECURITY_AUTHENTICATION_MODE: jwt
      HIDRA_UXR26_API_URL: http://127.0.0.1:8080
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: hidra
      PGPASSWORD: hidra-f16-disposable-ci
      PGDATABASE: hidra_alarm_f16
    steps:
      - name: Checkout WEB
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout immutable qualified T62 API
        uses: actions/checkout@v5
        with:
          repository: CHOUABBIA-AMINE/HidraAPI
          ref: b451302179eb3a5877aefcb105dab0f3ccb47897
          path: .alarm-native-api
          persist-credentials: false
      - name: Set up Java 21 and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: .alarm-native-api/pom.xml
      - name: Set up declared Node version
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify contract and install generated clients and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm run openapi:compatibility
          npm run prebuild
          npx playwright install --with-deps chromium
          if ! command -v psql >/dev/null || ! command -v htpasswd >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client apache2-utils
          fi
      - name: Build immutable accepted API
        working-directory: .alarm-native-api
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b451302179eb3a5877aefcb105dab0f3ccb47897
          for attempt in 1 2 3; do
            if bash ./mvnw -B --version; then break; fi
            test "$attempt" -lt 3
            sleep "$((attempt * 5))"
          done
          bash ./mvnw -B -q -Dmaven.test.skip=true package
      - name: Run mandatory F16 signed native acceptance
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export HIDRA_F16_PRIVATE_DIR="$(mktemp -d "$RUNNER_TEMP/f16-private.XXXXXXXX")"
          export HIDRA_JWT_HMAC_SECRET="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$HIDRA_JWT_HMAC_SECRET"
          api_pid=
          cleanup() {
            if [ -n "$api_pid" ]; then
              kill "$api_pid" 2>/dev/null || true
              wait "$api_pid" || true
            fi
            rm -rf -- "$HIDRA_F16_PRIVATE_DIR"
          }
          trap cleanup EXIT
          app_jar="$(find .alarm-native-api/target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)"
          test -n "$app_jar"
          java -jar "$app_jar" --server.address=127.0.0.1 --server.port=8080 \
            --management.server.port=8080 --hidra.security.bootstrap.enabled=false \
            --springdoc.api-docs.enabled=true --springdoc.swagger-ui.enabled=false \
            --hidra.platform.security.jwt.token-issuer=https://alarm-f16.synthetic.invalid \
            --hidra.platform.security.cors.allowed-origins=http://127.0.0.1:5173 \
            >"$HIDRA_F16_PRIVATE_DIR/api.log" 2>&1 &
          api_pid=$!
          ready=false
          for attempt in $(seq 1 75); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then ready=true; break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then echo "F16 disposable API startup failed."; exit 1; fi
          node scripts/prepare-alarm-native.mjs
          export PLAYWRIGHT_JSON_OUTPUT_NAME="$HIDRA_F16_PRIVATE_DIR/results.json"
          browser_status=0
          npx playwright test --config=playwright.alarm-native.config.ts --reporter=list,json \
            >"$HIDRA_F16_PRIVATE_DIR/browser.log" 2>&1 || browser_status=$?
          export F16_BROWSER_STATUS="$browser_status"
          mkdir -p "$RUNNER_TEMP/f16-evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          private = Path(os.environ['HIDRA_F16_PRIVATE_DIR'])
          expected = {'SIGNED_SCOPED_LISTS','DENIED_NO_HISTORY','BROWSER_ACK_PERSISTED','FRESH_LOGIN_READBACK','REVOCATION_CLEAR','CURRENT_OWNER_FAIL_CLOSED'}
          found = {line.split('=',1)[1] for line in (private/'browser.log').read_text(errors='replace').splitlines()
                   if line.startswith('F16_CHECKPOINT=')}
          print('F16 completed checkpoints: ' + ', '.join(sorted(expected & found)))
          if os.environ['F16_BROWSER_STATUS'] != '0' or not (private/'results.json').is_file():
              raise SystemExit('F16 native browser failed; private raw diagnostics are not published.')
          stats = json.loads((private/'results.json').read_text())['stats']
          assert stats['expected'] == 1 and stats['unexpected'] == stats['flaky'] == stats['skipped'] == 0
          assert expected <= found, 'F16 required checkpoints are missing'
          summary = {'web_sha':os.environ['GITHUB_SHA'],
                     'api_sha':'b451302179eb3a5877aefcb105dab0f3ccb47897',
                     'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                     'database':'hidra_alarm_f16','mode':'synthetic-development-only',
                     'expected':stats['expected'],'unexpected':stats['unexpected'],
                     'flaky':stats['flaky'],'skipped':stats['skipped'],'checkpoints':sorted(expected)}
          (Path(os.environ['RUNNER_TEMP'])/'f16-evidence'/'summary.json').write_text(json.dumps(summary,sort_keys=True)+'\n')
          print('F16 native qualification: 1 passed, 0 failed/flaky/skipped.')
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .alarm-native-api rev-parse HEAD)" = b451302179eb3a5877aefcb105dab0f3ccb47897
          sha256sum openapi/candidates/hidra-alarm-b451302179eb3a5877aefcb105dab0f3ccb47897.json > "$RUNNER_TEMP/f16-evidence/contract.sha256"
          psql -X -v ON_ERROR_STOP=1 --csv -c 'SELECT installed_rank,version,script,checksum,success FROM public.flyway_schema_history ORDER BY installed_rank' > "$RUNNER_TEMP/f16-evidence/migrations.csv"
      - name: Upload redacted F16 development evidence
        uses: actions/upload-artifact@v4
        with:
          name: hidraweb-f16-${{ github.sha }}
          path: ${{ runner.temp }}/f16-evidence
          if-no-files-found: error

  uxr29-native:
    name: UXR-29 signed response, HSE and Planning browser qualification
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact WEB
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout immutable accepted T62 API
        uses: actions/checkout@v5
        with:
          repository: CHOUABBIA-AMINE/HidraAPI
          ref: b451302179eb3a5877aefcb105dab0f3ccb47897
          path: .uxr29-api
          persist-credentials: false
      - name: Set up Java 21 and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: .uxr29-api/pom.xml
      - name: Set up declared Node version
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify immutable contracts and prepare Chromium
        run: |
          npm ci --no-audit --no-fund
          npm run openapi:compatibility
          npm run prebuild
          npx playwright install --with-deps chromium
          docker info >/dev/null
      - name: Run original API witnesses and mandatory four signed WEB phases
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .uxr29-api rev-parse HEAD)" = b451302179eb3a5877aefcb105dab0f3ccb47897
          export HIDRA_UXR29_WEB_ROOT="$GITHUB_WORKSPACE"
          export HIDRA_UXR29_EVIDENCE_DIR="$RUNNER_TEMP/uxr29-evidence"
          export HIDRA_E2E_AUTH_MOCK=0
          private="$(mktemp -d "$RUNNER_TEMP/uxr29-private.XXXXXXXX")"
          trap 'rm -rf -- "$private"' EXIT
          mkdir -p "$HIDRA_UXR29_EVIDENCE_DIR"
          python3 scripts/prepare-uxr29-native.py .uxr29-api
          git -C .uxr29-api diff --check
          status=0
          (
            cd .uxr29-api
            for attempt in 1 2 3; do
              if bash ./mvnw -B --version; then break; fi
              test "$attempt" -lt 3
              sleep "$((attempt * 5))"
            done
            bash ./mvnw -B -q test -DfailIfNoTests=true -Dtest=Gz2IncidentLeakInvestigationNativeHttpPostgresIntegrationTest,Gz2HseCapaNativeHttpPostgresIntegrationTest,Gz2PlanningNominationNativeHttpPostgresIntegrationTest
          ) >"$private/maven.log" 2>&1 || status=$?
          grep -E '^UXR29_DIAG (PHASE=(RESPONSE_BEFORE|RESPONSE_AFTER|HSE_AFTER|PLANNING_SUBMIT_REVIEW)|COUNTS EXPECTED=[0-9]+ UNEXPECTED=[0-9]+ FLAKY=[0-9]+ SKIPPED=[0-9]+|CHECKPOINT=[A-Z_]+|FAILURE_LINE=[0-9]+|REQUEST=(ALARM_MANUAL_DETAIL|ALARM_MANUAL_EVIDENCE|INCIDENT_TIMELINE|INCIDENT_INVESTIGATION|INCIDENT_ESCALATION|HSE_CAPA_LIST|HSE_HISTORY|HSE_CAPA_DETAIL|SIGNED_ALARM_MANUAL_EVIDENCE|SIGNED_INCIDENT_TIMELINE|SIGNED_INCIDENT_INVESTIGATION|SIGNED_INCIDENT_ESCALATION|SIGNED_HSE_CAPA_LIST|SIGNED_HSE_HISTORY|SIGNED_HSE_CAPA_DETAIL):([1-5][0-9]{2}|WAIT_FAILED)|REPORT_MISSING|PASSED)$' "$private/maven.log" || true
          test "$status" -eq 0 || { echo 'UXR29 native execution failed; private logs are not exported.'; exit 1; }
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          pin = "b451302179eb3a5877aefcb105dab0f3ccb47897"
          expected_methods = {
              "Gz2IncidentLeakInvestigationNativeHttpPostgresIntegrationTest": {"signedInvestigationAndIndependentDispositionSurviveRestart"},
              "Gz2HseCapaNativeHttpPostgresIntegrationTest": {"signedCompanyAndFacilityReadsConcealNonexistentCasesAndRejectWrongScope","signedImpactAssessmentAndApprovedClosureSurviveRestart"},
              "Gz2PlanningNominationNativeHttpPostgresIntegrationTest": {"currentApprovedRevisionSupportsIndependentNominationDisposition","uxr29BrowserSubmitsAndIndependentlyDecidesCurrentDrafts"},
          }
          for name, methods in expected_methods.items():
              report = Path(".uxr29-api/target/surefire-reports") / ("TEST-dz.sh.hidra.qualification." + name + ".xml")
              root = ET.parse(report).getroot()
              assert root.get("tests") == str(len(methods))
              assert all(root.get(k) == "0" for k in ("failures","errors","skipped"))
              assert {c.get("name") for c in root.findall("testcase")} == methods
          pins = {
              "alarm":"cf152e52ad51591a385327439f27f79fc741ab9b9c3dd6a025b301ca320432ab",
              "incident":"b0c20686eaec127ff41d3a4381b47317bab200876f02e437c2b699933e1590a3",
              "leak":"38ccba87706d93edfaaae763622e3b5eb2e44a855d0503385bd54904486af062",
              "hse":"33a24003336a6ff2197d09918b7480f106f89de06b4f2312a24eb5d0f8936da7",
              "planning":"009e81a44bb64412cf7f45b6640873eb421814616a87674f40708c0d13ee5df7",
          }
          for name, digest in pins.items():
              candidate = Path("openapi/candidates") / ("hidra-" + name + "-" + pin + ".json")
              assert hashlib.sha256(candidate.read_bytes()).hexdigest() == digest
          phases = {"RESPONSE_BEFORE","RESPONSE_AFTER","HSE_AFTER","PLANNING_SUBMIT_REVIEW"}
          evidence = Path(os.environ["HIDRA_UXR29_EVIDENCE_DIR"])
          assert {p.name for p in evidence.iterdir()} == {p+".json" for p in phases}
          inventories = []
          for phase in phases:
              record = json.loads((evidence/(phase+".json")).read_text())
              assert record["api_sha"] == pin and record["web_sha"] == os.environ["GITHUB_SHA"]
              assert record["run_id"] == os.environ["GITHUB_RUN_ID"] and record["run_attempt"] == os.environ["GITHUB_RUN_ATTEMPT"]
              assert record["browser"]["phase"] == phase
              assert record["browser"]["counts"] == dict(expected=1,unexpected=0,flaky=0,skipped=0)
              assert record["browser"]["checkpoints"][-1] == "COMPLETE"
              assert record["contracts"] == pins
              assert record["migrations"] and all(m["success"] is True for m in record["migrations"])
              inventories.append(record["migrations"])
          assert all(i == inventories[0] for i in inventories)
          print("UXR29 native: four exact phase passes; five backend test methods passed; all contract and migration inventories match.")
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .uxr29-api rev-parse HEAD)" = b451302179eb3a5877aefcb105dab0f3ccb47897
      - name: Upload redacted UXR-29 development evidence
        uses: actions/upload-artifact@v4
        with:
          name: hidraweb-uxr29-${{ github.sha }}
          path: ${{ runner.temp }}/uxr29-evidence
          if-no-files-found: error
