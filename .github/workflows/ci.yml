name: HidraWEB Code CI

on:
  push:
    branches:
      - main
      - 'hweb-*'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify HidraAPI OpenAPI compatibility
        run: npm run openapi:compatibility

      - name: Generate HWEB-003 workbench OpenAPI client
        run: npm run api:generate:workbench
      - name: Generate HWEB-004 identity/organization OpenAPI client
        run: npm run api:generate:identity-organization
      - name: Generate HWEB-F11 Party OpenAPI client
        run: npm run api:generate:party
      - name: Generate HWEB-005 topology OpenAPI client
        run: npm run api:generate:topology
      - name: Generate HWEB-006 telemetry/monitoring OpenAPI client
        run: npm run api:generate:telemetry-monitoring
      - name: Generate HWEB-007 workflow OpenAPI client
        run: npm run api:generate:workflow
      - name: Generate HWEB-008 alarm OpenAPI client
        run: npm run api:generate:alarm
      - name: Generate HWEB-009 incident OpenAPI client
        run: npm run api:generate:incident
      - name: Generate HWEB-009 leak OpenAPI client
        run: npm run api:generate:leak
      - name: Generate HWEB-009 HSE OpenAPI client
        run: npm run api:generate:hse
      - name: Generate HWEB-010 planning OpenAPI client
        run: npm run api:generate:planning
      - name: Generate HWEB-011 assets OpenAPI client
        run: npm run api:generate:assets
      - name: Generate HWEB-011 integrity OpenAPI client
        run: npm run api:generate:integrity
      - name: Generate HWEB-012 custody OpenAPI client
        run: npm run api:generate:custody
      - name: Generate HWEB-013 risk OpenAPI client
        run: npm run api:generate:risk
      - name: Generate HWEB-013 analytics OpenAPI client
        run: npm run api:generate:analytics
      - name: Generate HWEB-013 simulation OpenAPI client
        run: npm run api:generate:simulation
      - name: Generate HWEB-013 reporting OpenAPI client
        run: npm run api:generate:reporting
      - name: Generate HWEB-014 audit OpenAPI client
        run: npm run api:generate:audit
      - name: Generate HWEB-014 configuration OpenAPI client
        run: npm run api:generate:configuration
      - name: Generate HWEB-014 documents OpenAPI client
        run: npm run api:generate:documents

      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test
      - name: Performance tests
        run: npm run test:performance
      - name: Production build
        run: npm run build
      - name: Package release artifact
        env:
          HIDRA_RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: npm run release:package
      - name: Verify release artifact
        env:
          HIDRA_RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: npm run release:verify
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full Playwright regression suite
        run: npm run test:e2e
      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidraweb-release-${{ github.sha }}
          path: release/hidraweb
          if-no-files-found: error

  foundation-native:
    name: A1 six-module native API and PostgreSQL browser qualification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hidra_foundation_w1
          POSTGRES_USER: hidra
          POSTGRES_PASSWORD: hidra-w1-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hidra -d hidra_foundation_w1"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      HIDRA_FOUNDATION_WEB_URL: http://127.0.0.1:5173
      HIDRA_FOUNDATION_API_URL: http://127.0.0.1:8080
      HIDRA_FOUNDATION_ADMIN: w1-native-admin
      HIDRA_FOUNDATION_REQUIRE_NATIVE: '1'
      HIDRA_TEST_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/hidra_foundation_w1
      HIDRA_TEST_DATASOURCE_USERNAME: hidra
      HIDRA_TEST_DATASOURCE_PASSWORD: hidra-w1-ci
      HIDRA_SECURITY_AUTHENTICATION_MODE: jwt
      HIDRA_SECURITY_BOOTSTRAP_ENABLED: 'true'
      HIDRA_SECURITY_BOOTSTRAP_USERNAME: w1-native-admin
      HIDRA_SECURITY_BOOTSTRAP_EMAIL_ADDRESS: w1-admin@synthetic.invalid
      SPRING_PROFILES_ACTIVE: test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: hidra
      PGPASSWORD: hidra-w1-ci
      PGDATABASE: hidra_foundation_w1
    steps:
      - name: Checkout WEB
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout accepted immutable API source
        uses: actions/checkout@v5
        with:
          repository: CHOUABBIA-AMINE/HidraAPI
          ref: 5817406923e53761577ac41bbc3f318b517c3977
          path: .native-api
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: .native-api/pom.xml
      - name: Restore pinned Maven wrapper distribution
        id: foundation-maven-wrapper
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/wrapper/dists
          key: ${{ runner.os }}-w1-maven-wrapper-${{ hashFiles('.native-api/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Bootstrap pinned Maven wrapper with bounded download retries
        working-directory: .native-api
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          for attempt in 1 2 3; do
            if ./mvnw -B --version; then exit 0; fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Pinned Maven wrapper bootstrap failed after 3 attempts"
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          exit 1
      - name: Save completed pinned Maven wrapper distribution
        if: steps.foundation-maven-wrapper.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/wrapper/dists
          key: ${{ steps.foundation-maven-wrapper.outputs.cache-primary-key }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install WEB and generate pinned clients
        run: |
          npm ci --no-audit --no-fund
          npm run prebuild
          npx playwright install --with-deps chromium
      - name: Generate disposable masked credential and signing material
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          password = secrets.token_urlsafe(32)
          signing = secrets.token_urlsafe(48)
          ordinary = secrets.token_urlsafe(32)
          proof = base64.b64encode(secrets.token_bytes(32)).decode('ascii')
          print('::add-mask::' + proof)
          print('::add-mask::' + password)
          print('::add-mask::' + signing)
          print('::add-mask::' + ordinary)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('HIDRA_FOUNDATION_PASSWORD=' + password + '\n')
              output.write('HIDRA_FOUNDATION_USER_PASSWORD=' + ordinary + '\n')
              output.write('HIDRA_IDENTITY_ORGANIZATIONCOMMITPROOF_SIGNINGKEYBASE64=' + proof + '\n')
              output.write('HIDRA_SECURITY_BOOTSTRAP_PASSWORD=' + password + '\n')
              output.write('HIDRA_JWT_HMAC_SECRET=' + signing + '\n')
          PY
      - name: Build pinned API and migrate fresh schema before administrator bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .native-api rev-parse HEAD)" = 5817406923e53761577ac41bbc3f318b517c3977
          cd .native-api
          chmod +x mvnw
          ./mvnw -B -q -Dmaven.test.skip=true package
          APP_JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "${APP_JAR}"
          java -jar "${APP_JAR}" --server.port=8080 --management.server.port=8080 \
            --springdoc.api-docs.enabled=true --springdoc.swagger-ui.enabled=false \
            --hidra.security.bootstrap.enabled=false \
            --hidra.platform.security.cors.allowed-origins=http://127.0.0.1:5173 \
            --hidra.platform.security.jwt.token-issuer=https://foundation.synthetic.invalid \
            > "${RUNNER_TEMP}/w1-api.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/w1-api.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "${RUNNER_TEMP}/w1-api.pid")" 2>/dev/null; then
              tail -n 100 "${RUNNER_TEMP}/w1-api.log"
              exit 1
            fi
            sleep 2
          done
          tail -n 100 "${RUNNER_TEMP}/w1-api.log"
          exit 1
      - name: Seed synthetic catalogs in the exact disposable database
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 --file scripts/foundation-native-fixture.sql
          psql -v ON_ERROR_STOP=1 --file scripts/foundation-topology-fixture.sql
          psql -v ON_ERROR_STOP=1 --file scripts/foundation-configuration-fixture.sql
      - name: Configure separated native appointment roles and purpose-specific key
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -XAtqc 'SELECT current_database()')" = hidra_foundation_w1
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          CREATE ROLE a1_appointment_config LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION PASSWORD 'hidra-w1-ci';
          CREATE ROLE a1_proof_admin LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION PASSWORD 'hidra-w1-ci';
          GRANT USAGE ON SCHEMA public TO a1_appointment_config, a1_proof_admin;
          GRANT EXECUTE ON FUNCTION public.hidra_org_activate_appointment_binding(text,text,text,bigint),
            public.hidra_org_activate_appointment_policy(text,text,bigint,jsonb),
            public.hidra_party_require_organization_configuration_reference(text) TO a1_appointment_config;
          GRANT EXECUTE ON FUNCTION public.hidra_identity_org_commit_admin(bigint,text,uuid,name,bytea) TO a1_proof_admin;
          DO $$
          DECLARE relation text;
          BEGIN
            FOR relation IN SELECT tablename FROM pg_tables WHERE schemaname='public'
              AND (tablename LIKE 'hidra_org_appointment_%' OR tablename='hidra_org_employee_assignment') LOOP
              EXECUTE format('REVOKE INSERT,UPDATE,DELETE ON public.%I FROM w2_app', relation);
            END LOOP;
          END $$;
          REVOKE ALL ON public.hidra_identity_org_commit_key_event,public.hidra_identity_org_commit_key_head,
            public.hidra_identity_org_commit_proof_use FROM w2_app,w2_installed,w2_setup,w2_configuration;
          GRANT UPDATE ON public.hidra_org_employee,public.hidra_org_unit,public.hidra_org_position,
            public.hidra_org_appointment_binding_head,public.hidra_org_appointment_policy_head,
            public.hidra_org_appointment_lock_key,public.hidra_org_employee_assignment TO w2_installed;
          GRANT INSERT ON public.hidra_org_appointment_lock_key,public.hidra_org_employee_assignment,
            public.hidra_org_appointment_event TO w2_installed;
          GRANT EXECUTE ON FUNCTION public.hidra_org_appointment_exact_id(text),
            public.hidra_identity_org_commit_key_context(boolean),
            public.hidra_org_appointment_final_guard(uuid,uuid,uuid,text,text,text,text,timestamptz,timestamptz,integer,bigint,bytea,bytea,timestamptz),
            public.hidra_org_appointment_read_guard(jsonb,timestamptz,timestamptz,integer,bigint,timestamptz) TO w2_installed;
          COMMIT;
          SQL
          revision="$(PGUSER=a1_proof_admin psql -XAt -v ON_ERROR_STOP=1 <<SQL
          SELECT public.hidra_identity_org_commit_admin(0,'a1-synthetic-key',gen_random_uuid(),'w2_installed',
            decode('${HIDRA_IDENTITY_ORGANIZATIONCOMMITPROOF_SIGNINGKEYBASE64}','base64'));
          SQL
          )"
          test "${revision}" = 1
          {
            echo 'HIDRA_IDENTITY_ORGANIZATIONCOMMITPROOF_ENABLED=true'
            echo 'HIDRA_IDENTITY_ORGANIZATIONCOMMITPROOF_KEYID=a1-synthetic-key'
            echo "HIDRA_IDENTITY_ORGANIZATIONCOMMITPROOF_KEYREVISION=${revision}"
          } >> "${GITHUB_ENV}"
      - name: Restart native API with real audited administrator bootstrap
        shell: bash
        run: |
          set -euo pipefail
          OLD_PID="$(cat "${RUNNER_TEMP}/w1-api.pid")"
          kill "${OLD_PID}"
          for attempt in $(seq 1 60); do
            if ! kill -0 "${OLD_PID}" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "${OLD_PID}" 2>/dev/null; then
            echo "Schema initialization process did not stop"
            exit 1
          fi
          APP_JAR="$(find .native-api/target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "${APP_JAR}"
          java -jar "${APP_JAR}" --server.port=8080 --management.server.port=8080 \
            --springdoc.api-docs.enabled=true --springdoc.swagger-ui.enabled=false \
            --hidra.security.bootstrap.enabled=true \
            --spring.datasource.username=w2_app --spring.datasource.password=hidra-w1-ci \
            --spring.flyway.url="${HIDRA_TEST_DATASOURCE_URL}" \
            --spring.flyway.user=hidra --spring.flyway.password=hidra-w1-ci \
            --hidra.platform.persistence.publication.enabled=true \
            --hidra.platform.persistence.publication.username=w2_installed \
            --hidra.platform.persistence.publication.password=hidra-w1-ci \
            --hidra.platform.persistence.topology-setup.enabled=true \
            --hidra.platform.persistence.topology-setup.username=w2_setup \
            --hidra.platform.persistence.topology-setup.password=hidra-w1-ci \
            --hidra.platform.persistence.station-configuration.enabled=true \
            --hidra.platform.persistence.station-configuration.username=w2_configuration \
            --hidra.platform.persistence.station-configuration.password=hidra-w1-ci \
            --hidra.platform.security.cors.allowed-origins=http://127.0.0.1:5173 \
            --hidra.platform.security.jwt.token-issuer=https://foundation.synthetic.invalid \
            > "${RUNNER_TEMP}/w1-api.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/w1-api.pid"
          for attempt in $(seq 1 60); do
            if ! kill -0 "$(cat "${RUNNER_TEMP}/w1-api.pid")" 2>/dev/null; then
              tail -n 100 "${RUNNER_TEMP}/w1-api.log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null &&
              [ "$(psql -Atqc "SELECT EXISTS (SELECT 1 FROM public.hidra_audit_event WHERE event_type_id='IDENTITY_LOCAL_ADMIN_BOOTSTRAP' AND event_category_id='SECURITY_ADMINISTRATION')")" = t ]; then
              echo "Native administrator bootstrap committed its required audit event"
              exit 0
            fi
            sleep 2
          done
          tail -n 100 "${RUNNER_TEMP}/w1-api.log"
          exit 1
      - name: Prepare synthetic current W2 permissions
        run: node scripts/prepare-foundation-topology.mjs
      - name: Run mandatory A1 Journey B and verify its handoff to Journey C
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_JSON_OUTPUT_NAME="${RUNNER_TEMP}/a1-native-results.json"
          npm run test:e2e:foundation -- --grep 'A1 native' --reporter=list,json
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ['PLAYWRIGHT_JSON_OUTPUT_NAME']) as report:
              stats = json.load(report)['stats']
          assert stats['expected'] == 1, stats
          assert stats['unexpected'] == stats['flaky'] == stats['skipped'] == 0, stats
          PYTHON
      - name: Run mandatory W1, W2 and W3 browser journeys against native JWT and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_JSON_OUTPUT_NAME="${RUNNER_TEMP}/w1-native-results.json"
          npm run test:e2e:foundation -- --grep-invert 'A1 native|W4 native' --reporter=list,json
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ['PLAYWRIGHT_JSON_OUTPUT_NAME']) as report:
              stats = json.load(report)['stats']
          assert stats['expected'] == 7, stats
          assert stats['unexpected'] == stats['flaky'] == stats['skipped'] == 0, stats
          print('W1/W2/W3 native browser qualification: 7 passed, 0 failed/flaky/skipped')
          PYTHON
      - name: Prepare explicit synthetic W4 source and process configuration
        run: node scripts/prepare-foundation-workflow.mjs
      - name: Run mandatory W4 native review and denial browser journeys
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_JSON_OUTPUT_NAME="${RUNNER_TEMP}/w4-native-results.json"
          npm run test:e2e:foundation -- --grep 'W4 native' --reporter=list,json
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ['PLAYWRIGHT_JSON_OUTPUT_NAME']) as report:
              stats = json.load(report)['stats']
          assert stats['expected'] == 2, stats
          assert stats['unexpected'] == stats['flaky'] == stats['skipped'] == 0, stats
          print('W4 native browser qualification: 2 passed, 0 failed/flaky/skipped; seven W1-W3 preserved')
          PYTHON
      - name: Record exact-source qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/a1-evidence"
          mkdir -p "${evidence}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          {
            printf 'WEB_SHA=%s\n' "${GITHUB_SHA}"
            printf 'API_SHA=%s\n' "$(git -C .native-api rev-parse HEAD)"
            printf 'GITHUB_RUN_ID=%s\n' "${GITHUB_RUN_ID}"
            printf 'GITHUB_RUN_ATTEMPT=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'JWT_ISSUER=https://foundation.synthetic.invalid\n'
            printf 'DATABASE=hidra_foundation_w1\n'
            printf 'TEST_DATA=synthetic\n'
          } > "${evidence}/sources.txt"
          curl --fail --silent --show-error http://127.0.0.1:8080/v3/api-docs > "${evidence}/runtime-openapi.json"
          (cd "${evidence}" && sha256sum runtime-openapi.json > runtime-openapi.sha256)
          psql -X -v ON_ERROR_STOP=1 --csv -c 'SELECT installed_rank,version,script,checksum,success FROM public.flyway_schema_history ORDER BY installed_rank' > "${evidence}/migrations.csv"
          cp "${RUNNER_TEMP}"/{a1,w1,w4}-native-results.json "${evidence}/"
      - name: Upload A1 development qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: hidraweb-foundation-a1-${{ github.sha }}
          path: ${{ runner.temp }}/a1-evidence
          if-no-files-found: error
      - name: Stop disposable native API
        if: always()
        shell: bash
        run: |
          if [ -f "${RUNNER_TEMP}/w1-api.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/w1-api.pid")" 2>/dev/null || true
          fi
