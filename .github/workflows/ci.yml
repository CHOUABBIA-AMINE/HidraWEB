name: HidraWEB CI

on:
  push:
    branches:
      - main
      - 'hweb-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate HWEB-003 workbench OpenAPI client
        run: npm run api:generate:workbench

      - name: Generate HWEB-004 identity/organization OpenAPI client
        run: npm run api:generate:identity-organization

      - name: Generate HWEB-005 topology OpenAPI client
        run: npm run api:generate:topology

      - name: Generate HWEB-006 telemetry/monitoring OpenAPI client
        run: npm run api:generate:telemetry-monitoring

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E browser tests
        run: npm run test:e2e
