    ExecutePlanningApprovalActionRequest:
      type: object
      required: [expectedTaskUpdatedAt]
      properties:
        expectedTaskUpdatedAt: { type: string, format: date-time }
        reasonId: { type: string }
        commentText: { type: string }
        decisionNote: { type: string }
